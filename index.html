<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon-512.png"><meta name="apple-mobile-web-app-title" content="问问伴读"><meta name="theme-color" content="#E6F2FF"></head><body>
<title>问问伴读</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* 问问伴读 · 设计
   给家长在 iPad 上一边陪读一边看的页面：内容为主，安静、留白足、一屏只有一个最强的按钮。
   底色是很淡的冷灰白；蓝色（和图标同色）只做提示、链接和步骤序号；金黄只给最主要的那个按钮；
   绿/红只在标“会了/卡壳”时出现。标题和要对孩子说的话用宋体，字词用楷体写在田字格里，其他都是苹方。 */
:root{
  color-scheme:light;
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#F6F8FB;
  --ink:#1B2435; --ink2:#4A5468; --muted:#8C95A6; --line:#E5EAF1;
  --blue:#2F7FDB; --blue-pale:#EAF3FD; --blue-line:#BFD6F1;
  --gold:#FFBE3B; --gold-ink:#3D2A00; --gold-pale:#FFF6E0; --gold-text:#8A5A00;
  --green:#1F9466; --green-pale:#E4F5EC; --grid:#A9D8BF;
  --red:#D24E3E; --red-pale:#FCEBE8;
  --shadow:0 1px 2px rgba(27,36,53,.04),0 8px 24px rgba(27,36,53,.06);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue-line);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
b,strong{font-weight:600}

.wrap{max-width:1120px;margin:0 auto;padding-block:20px 80px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;letter-spacing:.04em}
.brand img{width:34px;height:34px;border-radius:9px;display:block}
.tabs{display:flex;background:#E7ECF3;border-radius:12px;padding:3px}
.tabs button{border:0;background:none;border-radius:9px;padding:6px 18px;font-size:15px;color:var(--ink2)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(27,36,53,.12)}

/* 两栏：左边往期，右边正文 */
.cards{display:flex;flex-direction:column;gap:40px}
.main{order:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.wrap>.main{order:0;width:100%;max-width:860px;margin:0 auto}
.side{order:2;display:flex;flex-direction:column;gap:4px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:0 12px 8px}
.side-h span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em}
.addbtn{border:0;background:none;color:var(--blue);font-size:15px;font-weight:600;padding:4px 0}
.list{display:flex;flex-direction:column;gap:2px}
.item{border:0;background:none;text-align:left;border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center}
.item:hover{background:rgba(255,255,255,.6)}
.item[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.item .t{min-width:0;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.5}
.item .s{font-size:12px;color:var(--muted);white-space:nowrap}
.item .s.ok{color:var(--green);font-weight:600}
.item .s.bad{color:var(--red)}
.more{border:0;background:none;color:var(--muted);font-size:14px;padding:8px 12px;text-align:left}
.empty{color:var(--muted);font-size:15px}
.side .empty{padding:4px 12px}

/* 白色面板：一个面板 = 一件事 */
.block{background:var(--surface);border-radius:20px;padding:28px 32px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.block h2{font-size:20px;font-weight:600;line-height:1.4}
.muted{color:var(--muted);font-size:15px}
.btn{border:0;border-radius:12px;padding:11px 22px;font-size:16px;font-weight:600;background:var(--gold);color:var(--gold-ink);transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#EDF0F4;color:#A9B1BE;cursor:default;transform:none}
.btn.light{background:var(--blue-pale);color:var(--blue)}
.btn.big{width:100%;padding:16px;font-size:18px;border-radius:14px}
.link{border:0;background:none;padding:4px 0;color:var(--muted);font-size:14px}
.link.red{color:var(--red)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.note{background:var(--gold-pale);color:var(--gold-text);border-radius:12px;padding:12px 16px;font-size:15px}
.err{background:var(--red-pale);color:#8A2A1F;border-radius:12px;padding:12px 16px;font-size:15px}
.eyebrow{font-size:14px;font-weight:600;color:var(--blue);letter-spacing:.04em}

/* 表单 */
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-size:14px;font-weight:600;color:var(--ink2)}
.field input[type=text],.field input[type=password],.field textarea,.field select{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--sunk);font-size:16px;min-width:0;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px var(--blue-pale)}
.field textarea{min-height:72px;resize:vertical;line-height:1.6}
.row.field{flex-direction:row}
.seg{display:inline-flex;background:#EEF2F7;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 16px;font-size:15px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(27,36,53,.12)}

/* 准备新的一篇 */
.hero{padding:40px 40px 36px;gap:28px}
.hero-t{display:flex;flex-direction:column;gap:8px}
.hero h2{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.3;letter-spacing:.02em}
.lead{color:var(--ink2);font-size:17px;max-width:34em}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:220px;border:1.5px dashed var(--blue-line);border-radius:16px;background:var(--blue-pale);color:var(--blue);font-size:18px;font-weight:600;text-align:center;padding:24px}
.drop svg{width:46px;height:46px;margin-bottom:4px}
.drop small{font-size:14px;font-weight:400;color:var(--muted)}
.drop input,.addtile input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.thumb{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:#EEF2F7;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .no{position:absolute;left:8px;top:8px;background:rgba(27,36,53,.72);color:#fff;border-radius:999px;font-size:12px;line-height:20px;padding:0 8px}
.thumb .x{position:absolute;right:6px;top:6px;border:0;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--ink);font-size:14px;box-shadow:0 1px 3px rgba(27,36,53,.2)}
.addtile{position:relative;aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--blue-line);border-radius:12px;background:var(--blue-pale);color:var(--blue);display:grid;place-items:center;font-size:15px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:16px 36px;align-items:center}
.opt{display:flex;align-items:center;gap:12px}
.opt>span{font-size:14px;color:var(--muted)}
.gobar{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.gobar .muted{text-align:center;min-height:1em}

/* 生成中 */
.gen{align-items:center;text-align:center;padding:64px 32px;gap:12px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--blue-pale);border-top-color:var(--blue);animation:spin 1s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 卡片头：不加框，靠字号和留白 */
.ch{display:flex;flex-direction:column;gap:10px;padding:12px 4px 8px}
.ch h1{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1.25;letter-spacing:.03em}
.ch .sum{font-size:18px;color:var(--ink2);max-width:34em}
.photos{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.photos button{flex:none;border:1px solid var(--line);border-radius:8px;padding:0;width:44px;height:58px;overflow:hidden;background:var(--surface)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .lbl{font-size:13px;color:var(--muted);margin-left:4px}
.tips{background:var(--gold-pale);border-radius:16px;padding:18px 24px;display:flex;flex-direction:column;gap:6px}
.tips h3{font-size:14px;font-weight:600;color:var(--gold-text);letter-spacing:.04em}
.tips ul{color:#5C4310}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* 步骤 */
.step{gap:18px}
.step-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.step-n{font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.08em;white-space:nowrap}
.step h2{font-size:21px}
.step .body{min-width:0;display:flex;flex-direction:column;gap:14px}
.say-line{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.6;color:var(--ink)}
.list-rows{display:flex;flex-direction:column}
.list-rows>*{padding:20px 0;border-top:1px solid var(--line)}
.list-rows>*:first-child{border-top:0;padding-top:4px}
.list-rows>*:last-child{padding-bottom:0}

/* 字词：楷体写进田字格 */
.wd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 24px;align-items:start}
.zi{display:flex;flex-direction:column;align-items:center;gap:4px}
.zi .py{font-size:14px;color:var(--muted);letter-spacing:.04em}
.tzs{display:flex}
.tz{width:54px;height:54px;display:grid;place-items:center;font-family:var(--kai);font-weight:400;font-size:38px;line-height:1;color:var(--ink);border:1.5px solid var(--grid);margin-left:-1.5px;
  background:linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,linear-gradient(90deg,var(--grid),var(--grid)) center/1px 100% no-repeat;background-color:var(--surface)}
.tz:first-child{margin-left:0}
.zi.long .tz{width:42px;height:42px;font-size:29px}
.wd .txt{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:20px}
.wd .txt p{font-size:17px}
.wd .txt p+p{font-size:15px;color:var(--ink2)}
.wd .txt .k{color:var(--muted);font-size:13px;margin-right:10px;font-weight:600}
.tag{font-size:12px;color:var(--gold-text);background:var(--gold-pale);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:2px;font-weight:600}
.acts{display:flex;gap:8px;align-items:center;padding-top:22px}
.mk{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--ink2);white-space:nowrap}
.mk.say{width:36px;height:36px;padding:0;display:grid;place-items:center;border-color:transparent;background:var(--blue-pale);color:var(--blue)}
.mk.say svg{width:18px;height:18px}
.mk[aria-pressed="true"].ok{background:var(--green-pale);border-color:var(--green-pale);color:var(--green);font-weight:600}
.mk[aria-pressed="true"].no{background:var(--red-pale);border-color:var(--red-pale);color:var(--red);font-weight:600}
.mk[aria-pressed="true"].mid{background:var(--gold-pale);border-color:var(--gold-pale);color:var(--gold-text);font-weight:600}

/* 复述、题目 */
.rt{display:grid;grid-template-columns:5em minmax(0,1fr);gap:4px 16px}
.rt .lb{color:var(--muted);font-size:14px;padding-top:3px}
.pr{font-size:17px}
details.ans{display:inline-block;margin:6px 18px 0 0}
details.ans summary{list-style:none;cursor:pointer;color:var(--blue);font-size:14px;font-weight:600}
details.ans summary::-webkit-details-marker{display:none}
details.ans summary::after{content:" ›"}
details.ans[open]{display:block}
details.ans[open] summary::after{content:" ⌄"}
details.ans .a{margin-top:6px;font-size:16px;color:var(--ink);background:var(--blue-pale);border-radius:10px;padding:10px 14px}
.qq{display:flex;flex-direction:column;gap:8px}
.qq .k{font-size:13px;color:var(--muted);font-weight:600}
.qq .qt{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.6}
.qq .row{gap:8px;margin-top:4px}

/* 读完 */
.donebtn{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:600;background:var(--gold);color:var(--gold-ink)}
.donebtn:active{transform:scale(.99)}
.donebtn.on{background:var(--green-pale);color:var(--green)}

/* 神兽、人物 */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.coll{background:var(--sunk);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.coll .nm{font-family:var(--serif);font-size:20px;font-weight:700}
.coll .nm small{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
.coll dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px}
.coll dt{color:var(--muted)}
.coll dd{margin:0}
.coll .pic{border-radius:10px;overflow:hidden;background:var(--surface);border:1px dashed var(--line);aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:var(--muted);font-size:14px;margin-top:6px}
.coll .pic img{width:100%;height:100%;object-fit:cover}

/* 积累本 */
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-radius:20px;padding:24px 8px;box-shadow:var(--shadow)}
.nums div{display:flex;flex-direction:column;align-items:center;gap:4px;border-left:1px solid var(--line)}
.nums div:first-child{border-left:0}
.nums b{font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.nums span{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.wc{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;line-height:1.3;min-width:64px}
.wc .py{font-size:12px;color:var(--muted)}
.wc b{font-family:var(--kai);font-weight:400;font-size:28px}
.wc small{font-size:11px;color:var(--muted)}
.wc.no{background:var(--red-pale);border-color:var(--red-pale)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 20px;font-size:15px;z-index:40;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(27,36,53,.2)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(18,24,36,.92);display:grid;place-items:center;padding:20px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:calc(100vh - 40px);border-radius:8px}
.status{text-align:center;font-size:13px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.spin{animation:none}.btn,.donebtn{transition:none}}
@media (max-width:640px){
  .block{padding:22px 20px;border-radius:18px}
  .hero{padding:28px 20px}
  .hero h2{font-size:28px}
  .ch h1{font-size:32px}
  .wd{grid-template-columns:minmax(0,1fr)}
  .zi{align-items:flex-start}
  .wd .txt,.acts{padding-top:0}
  .rt{grid-template-columns:4em minmax(0,1fr)}
  .nums{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px}
  .nums div:nth-child(4){border-left:0}
}
@media (min-width:900px){
  .cards{display:grid;grid-template-columns:232px minmax(0,1fr);gap:40px;align-items:start}
  .side{order:0;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-top:14px}
  .main{max-width:780px}
}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand"><img src="icon.png" alt="">问问伴读</h1>
    <nav class="tabs" aria-label="页面">
      <button data-tab="cards" aria-pressed="true">伴读卡</button>
      <button data-tab="bank" aria-pressed="false">积累本</button>
      <button data-tab="set" aria-pressed="false">设置</button>
    </nav>
  </header>

  <section id="v-cards" class="cards">
    <aside class="side">
      <div class="side-h"><span>往期伴读卡</span><button class="addbtn" id="newBtn">＋ 新的一篇</button></div>
      <div class="list" id="list"></div>
    </aside>
    <div class="main" id="main"><p class="muted">正在打开记录本…</p></div>
  </section>

  <section id="v-bank" class="main" hidden></section>
  <section id="v-set" class="main" hidden></section>
  <div class="status" id="status"></div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lb" hidden><img id="lbImg" alt="书页照片"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>fmt(new Date());
const WD="日一二三四五六";
function parseD(ds){const[y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(ds,n){const d=parseD(ds);d.setDate(d.getDate()+n);return fmt(d)}
function dayLabel(ds){if(!ds)return"";if(ds===today())return"今天";if(ds===addDays(today(),-1))return"昨天";const d=parseD(ds);return(d.getMonth()+1)+"月"+d.getDate()+"日"}
const weekday=ds=>"周"+WD[parseD(ds).getDay()];
const arr=x=>Array.isArray(x)?x:[];
const PH={},BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const blobUrl=id=>PH[id]||BLANK;
const phWait={};
function loadPhoto(id){if(PH[id])return Promise.resolve(PH[id]);return phWait[id]||(phWait[id]=gh.photo(id).then(u=>{PH[id]=u;return u}).finally(()=>{delete phWait[id]}))}
function hydrate(){document.querySelectorAll("img[data-ph]:not([data-ok])").forEach(img=>{img.dataset.ok="1";loadPhoto(img.dataset.ph).then(u=>{img.src=u}).catch(()=>{img.style.visibility="hidden"})})}
const blobToDataURL=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ---------------- 朗读 ---------------- */
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang));
  const sc=v=>(/premium|enhanced|优化|高级|高品质|增强|natural/i.test(v.name)?20:0)+(/(zh|cmn)[-_]CN/i.test(v.lang)?5:0);
  return vs.sort((a,b)=>sc(b)-sc(a))[0]||null}catch(e){return null}}
function say(text){try{const u=new SpeechSynthesisUtterance(text),v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="zh-CN";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ---------------- 状态 ---------------- */
const S={cards:{},profile:null,sel:null,view:"new",tab:"cards",showAll:false,live:{},draft:null,loaded:false};

/* ---------------- 记录本（GitHub 私密 Gist） ----------------
   每次改动先存在本机、记进待同步列表；同步时取下最新的 Gist，套上这些改动再写回，
   所以 iPad 和电脑各点各的不会互相覆盖。和星星积分卡同一个办法。 */
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ghKey=()=>ls.get("wwbd:ghkey","")||ls.get("xdj:key","");
const GIST_DESC="问问伴读记录 wenwen-reading-data",COLS=["cards","settings"];
const hhmm=()=>{const d=new Date();return d.getHours()+":"+pad(d.getMinutes())};
const setStatus=t=>{$("#status").textContent=t};
const gh={
  async api(path,opt={}){
    const r=await fetch("https://api.github.com"+path,{...opt,cache:"no-store",headers:{Authorization:"Bearer "+ghKey(),Accept:"application/vnd.github+json",...(opt.body?{"Content-Type":"application/json"}:{})}});
    if(!r.ok)throw r.status;return r.status===204?null:r.json()},
  async gistId(){
    const saved=ls.get("wwbd:gist","");if(saved)return saved;
    for(let page=1;page<=10;page++){const l=await this.api("/gists?per_page=100&page="+page);
      const g=l.find(g=>g.description===GIST_DESC);if(g){ls.set("wwbd:gist",g.id);return g.id}if(l.length<100)break}
    throw "nogist"},
  async file(f){return f?(f.truncated?await (await fetch(f.raw_url,{cache:"no-store"})).text():f.content):""},
  async photo(id){const g=await this.api("/gists/"+id);return this.file(g.files["photo.txt"])},
  async upload(blob){const u=await blobToDataURL(blob);
    const g=await this.api("/gists",{method:"POST",body:JSON.stringify({description:"问问伴读照片",public:false,files:{"photo.txt":{content:u}}})});
    PH[g.id]=u;return{id:g.id}},
  async del(id){await this.api("/gists/"+id,{method:"DELETE"})}
};
const DB={
  data:{cards:ls.get("wwbd:c:cards",{}),settings:ls.get("wwbd:c:settings",{})},subs:[],busy:false,again:false,
  emit(){for(const f of this.subs)f()},
  put(col,id,val){
    if(val===null)delete this.data[col][id];else this.data[col][id]=val;
    ls.set("wwbd:c:"+col,this.data[col]);
    const p=ls.get("wwbd:pend",[]);p.push([col,id,val]);ls.set("wwbd:pend",p);
    this.emit();this.sync()},
  async sync(){
    if(!ghKey()){setStatus("还没设置同步钥匙，记录先存在这台设备上（在「设置」里粘贴）");return}
    if(this.busy){this.again=true;return}
    this.busy=true;
    try{
      const id=await gh.gistId(),g=await gh.api("/gists/"+id+"?t="+Date.now());
      const pend=ls.get("wwbd:pend",[]),files={},remote={};
      for(const c of COLS){
        let m={};try{m=JSON.parse((await gh.file(g.files[c+".json"]))||"{}")}catch(e){}
        const mine=pend.filter(x=>x[0]===c);
        for(const[,i,d]of mine){if(d===null)delete m[i];else m[i]=d}
        if(mine.length)files[c+".json"]={content:JSON.stringify(m)};
        remote[c]=m;
      }
      if(Object.keys(files).length)await gh.api("/gists/"+id,{method:"PATCH",body:JSON.stringify({files})});
      const rest=ls.get("wwbd:pend",[]).slice(pend.length);ls.set("wwbd:pend",rest);
      for(const[c,i,d]of rest){if(d===null)delete remote[c][i];else remote[c][i]=d}
      const changed=COLS.some(c=>JSON.stringify(remote[c])!==JSON.stringify(this.data[c]));
      for(const c of COLS){this.data[c]=remote[c];ls.set("wwbd:c:"+c,remote[c])}
      if(changed)this.emit();
      setStatus("✅ 已和电脑、iPad 同步 "+hhmm());
    }catch(e){
      if(e===401||e===403)setStatus("同步钥匙不对或过期了，请在「设置」里重新粘贴");
      else if(e===404){ls.set("wwbd:gist",null);setStatus("找不到记录本，请稍后刷新再试")}
      else if(e==="nogist")setStatus("这把钥匙找不到伴读的记录本，请确认粘贴的是对的钥匙");
      else setStatus("暂时没连上网，记录先存在这台设备上，连上网会自动同步");
    }finally{this.busy=false;if(this.again){this.again=false;this.sync()}}
  },
  start(){
    this.sync();
    setInterval(()=>{if(!document.hidden)this.sync()},30000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)this.sync()});
    addEventListener("online",()=>this.sync());
  }
};
function setCard(id,data){DB.put("cards",id,data);return Promise.resolve()}
function deepMerge(a,b){const o={...a};for(const k in b){o[k]=(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a&&typeof a[k]==="object"&&!Array.isArray(a[k]))?deepMerge(a[k],b[k]):b[k]}return o}
function updCard(id,patch){DB.put("cards",id,deepMerge(DB.data.cards[id]||{},patch));return Promise.resolve()}
function delCard(id){DB.put("cards",id,null);return Promise.resolve()}

/* ---------------- 请 Claude 写卡（用家长自己的 Claude 钥匙） ---------------- */
const MODEL="claude-opus-5-5";
const apiKey=()=>ls.get("wwbd:apikey","");
const claudeAI={
  async json(prompt,{images=[],onText}={}){
    const content=[];
    for(const b of images)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:(await blobToDataURL(b)).split(",")[1]}});
    content.push({type:"text",text:prompt});
    let r;
    try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":apiKey(),"anthropic-version":"2023-06-01","anthropic-beta":"server-side-fallback-2026-07-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:MODEL,max_tokens:32000,stream:true,fallbacks:"default",output_config:{effort:"medium"},messages:[{role:"user",content}]})})}
    catch(e){throw{code:"network"}}
    if(!r.ok){let m="";try{m=(await r.json())?.error?.message||""}catch(e){}
      throw{code:r.status===401?"bad_key":r.status===429?"rate_limited":(r.status===529||r.status>=500)?"overloaded":/credit|balance|billing/i.test(m)?"no_credit":/too large|too long|exceed/i.test(m)?"prompt_too_large":/image/i.test(m)?"image_rejected":"api",message:m}}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="",text="",stop="";
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;
        let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
        if(ev.type==="content_block_start"&&ev.content_block?.type==="fallback")text="";
        else if(ev.type==="content_block_delta"&&ev.delta?.type==="text_delta"){text+=ev.delta.text;onText&&onText({text})}
        else if(ev.type==="message_delta"&&ev.delta?.stop_reason)stop=ev.delta.stop_reason;
        else if(ev.type==="error")throw{code:ev.error?.type==="overloaded_error"?"overloaded":"api",message:ev.error?.message}}}
    if(stop==="refusal")throw{code:"refused"};
    if(!text.trim())throw{code:"empty_completion"};
    const a=text.indexOf("{"),z=text.lastIndexOf("}");if(a<0||z<a)throw{code:"invalid_json"};
    try{return JSON.parse(text.slice(a,z+1))}catch(e){throw{code:"invalid_json"}}
  }
};

  if(c.status==="done")return`<span class="s ok">✓ 已读</span>`;
  if(c.status==="generating")return`<span class="s">生成中</span>`;
  if(c.status==="failed"&&!c.card)return`<span class="s bad">没生成</span>`;
  return`<span class="s"></span>`;
}

/* 压缩照片：长边 1800，JPEG */
async function shrink(file){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const k=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    return await new Promise(ok=>c.toBlob(b=>ok(b||file),"image/jpeg",.86));
  }catch(e){return file}
}

/* ---------------- 让 Claude 写卡 ---------------- */
function pastWords(exceptId){
  const ws=[],stuck=[];
  for(const c of sortedCards()){if(c.id===exceptId||!c.card||c.example)continue;
    for(const w of arr(c.card.words)){if(!w?.word)continue;ws.push(w.word+"（"+(c.card.title||"")+"）");if(c.marks?.words?.[w.word]==="stuck")stuck.push(w.word)}
    for(const ch of (c.marks?.stuckChars||"").replace(/[\s，,、]/g,""))stuck.push(ch);
  }
  return{ws:ws.slice(0,80),stuck:[...new Set(stuck)].slice(0,40)};
}

【孩子】
名字：${p.name||"问问"}；${p.grade||"小学一年级"}。
喜欢的东西：${p.likes||"（家长没填）"}
课内正在学的字：${p.inClass||"（家长没填）"}

${c.note?"家长备注："+c.note+"\n":""}

${pw.ws.length?pw.ws.join("、"):"还没有"}

【照片】
附上的照片是今天要读的书页，按顺序排列。先认真读懂照片上的文字。所有内容都以照片里的原文为准，不要编原文里没有的情节或说法。照片看不清、缺页或者不是书页时，写在 problems 里，能做多少做多少。

【写作原则】

4. ${fan?"泛读日不出题，questions 返回空数组。":"题目两道：第一道“找一找”，答案在原文里能指出来；第二道“想一想”，可以推理原因、猜心情或“如果是你”，没有唯一答案。每道题配一句答不上来时家长可以给的提示。"}
5. 复述：${fan?"泛读日 retell 的 items 返回空数组。":"神话或有情节的故事用“故事三步”（谁 → 发生了什么 → 结果怎样）；介绍神兽、怪物、地方的用“神兽档案”（叫什么、住在哪里、长什么样、有什么本领或特点）。prompt 是家长说的前半句，留空处用 ____，answer 是孩子该接的内容。"}

7. 复现：今天原文里如果出现了“以前学过的字词”里的字词，或者卡壳过的字，写进 review，告诉家长读到时怎么提醒。

function clean(card){
  card=card&&typeof card==="object"&&!Array.isArray(card)?card:{};
  for(const k of["words","questions","review","tips","beasts","people","examinerQuestions"])card[k]=arr(card[k]).filter(x=>x!=null);
  card.retell=card.retell&&typeof card.retell==="object"?card.retell:{type:"",items:[]};card.retell.items=arr(card.retell.items);
  card.warmup=card.warmup&&typeof card.warmup==="object"?card.warmup:null;
  card.task=card.task&&typeof card.task==="object"?card.task:null;
  return card;
}
const ERR={bad_key:"Claude 钥匙不对或失效了，去「设置」里重新粘贴。",no_credit:"Claude 账户的余额用完了，去 console.anthropic.com 充值后再试。",overloaded:"Claude 现在太忙，过一两分钟点“再试一次”。",network:"没连上网，连上后点“再试一次”。",api:"Claude 那边出了点问题，点“再试一次”。",rate_limited:"用得太频繁了，过一会儿再试。",image_rejected:"有照片读不了，换一张清楚的再试。",refused:"Claude 没法处理这些照片，换一下照片再试。",invalid_json:"Claude 写出来的格式不对，点“再试一次”。",empty_completion:"Claude 没写出内容，点“再试一次”。",prompt_too_large:"内容太多了，少放几张照片再试。"};
const errMsg=e=>ERR[e?.code]||"网络或服务出了点问题，点“再试一次”。";

async function runSample(id,blobs,extra){
  const c={id,...S.cards[id]};
  S.live[id]={chars:0};if(S.sel===id)renderMain();
  try{
    const card=await cap.sample.json(buildPrompt(c,extra),{images:blobs,onText:({text})=>{S.live[id].chars=text.length;const el=document.getElementById("genChars");if(el)el.textContent="已经写了 "+text.length+" 个字"}});
    delete S.live[id];
    await updCard(id,{status:c.marks?.done?"done":"ready",card:clean(card),error:"",genAt:Date.now()});
  }catch(e){
    delete S.live[id];
    if(e?.code==="cancelled"){await updCard(id,{status:c.card?"ready":"failed",error:"停下来了"});return}
    await updCard(id,{status:c.card?"ready":"failed",error:errMsg(e)});
    if(c.card)toast(errMsg(e));
  }
  if(S.sel===id)renderMain();
}
async function photoBlobs(c){
  const out=[];for(const pid of arr(c.photos)){try{const u=await loadPhoto(pid);out.push(await (await fetch(u)).blob())}catch(e){}}return out;
}
async function generate(){
  const d=S.draft;const msg=$("#genMsg"),btn=$("#genBtn");
  if(!d.files.length){toast("先拍一下今天要读的书页");return}
  const files=cap.imgMax?d.files.slice(0,cap.imgMax):d.files;
  btn.disabled=true;msg.textContent="正在整理照片…";
  const blobs=[];for(const f of files)blobs.push(await shrink(f.file));
  const photos=[];
  if(cap.assets){msg.textContent="正在保存照片…";
    for(const b of blobs){try{const r=await cap.assets.upload(b,{type:b.type||"image/jpeg"});photos.push(r.id)}catch(e){console.warn(e)}}
    if(photos.length<blobs.length)toast("有照片没存上，不影响生成");
  }else{toast("还没设置同步钥匙，照片这次不保存");
  }
  const date=today(),id=date+"-"+Date.now().toString(36);
  const doc={date,book:"",mode:d.mode,style:d.style,note:"",photos,status:"generating",createdAt:Date.now(),marks:{words:{},q:{},stuckChars:"",done:false}};
  await setCard(id,doc);
  if(!S.cards[id])S.cards[id]=doc;
  d.files.forEach(f=>URL.revokeObjectURL(f.url));S.draft=null;
  S.sel=id;S.view="card";renderList();renderMain();
  runSample(id,blobs,"");
}

function renderCard(id){
  const c=S.cards[id];if(!c){S.view="new";return renderNew()}
  const k=c.card;const m=c.marks||{};
  const metaParts=[dayLabel(c.date)+" "+(c.date?weekday(c.date):""),c.book,c.mode,c.style&&c.style!=="标准"?c.style:"",c.example?"示例卡":""].filter(Boolean);
  const photos=arr(c.photos).length?`<div class="photos">${arr(c.photos).map((p,i)=>`<button data-photo="${esc(p)}" aria-label="看第 ${i+1} 页照片"><img data-ph="${esc(p)}" src="${blobUrl(p)}" alt=""></button>`).join("")}<span class="lbl">原文 ${arr(c.photos).length} 页，点开看大图</span></div>`:"";
  const title=`<header class="ch"><p class="eyebrow">${esc(metaParts.join(" · "))}</p><h1>${esc(k?.title||"今天这一篇")}</h1>${k?.summary?`<p class="sum">${esc(k.summary)}</p>`:""}${photos}</header>`;

  if(S.live[id]||(c.status==="generating"&&!k&&Date.now()-(c.createdAt||0)<8*60e3)){

    return;
  }
  if(!k){
    $("#main").innerHTML=title+`<div class="block"><h2>卡片没生成出来</h2><div class="err">${esc(c.error||"生成中断了。")}</div>
      <div class="row"><button class="btn" data-act="retry" ${cap.sample?"":"disabled"}>再试一次</button><button class="link red" data-act="del">删掉这一篇</button></div></div>`;
    return;
  }
  const B=[];let n=0;
  const step=(h,body)=>`<section class="block step"><div class="step-h"><span class="step-n">第 ${++n} 步</span><h2>${h}</h2></div><div class="body">${body}</div></section>`;

  if(k.problems)B.push(`<div class="note">${esc(k.problems)}</div>`);
  if(c.error&&c.status!=="generating")B.push(`<div class="err">上次重新生成没成功：${esc(c.error)}</div>`);
  if(k.tips.length)B.push(`<div class="tips"><h3>读之前先看一眼</h3><ul class="plain">${k.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`);

  if(k.warmup?.question)B.push(step("读之前，问一句",`<p class="say-line">“${esc(k.warmup.question)}”</p>${k.warmup.tip?`<p class="muted">${esc(k.warmup.tip)}</p>`:""}`));
  B.push(step("一起读",`<p>你带读一句，问问跟读一句。</p>${k.review.length?`<div><p class="muted">读到这些学过的字时停一下：</p><ul class="plain">${k.review.map(r=>`<li><b>${esc(r.word)}</b>　${esc(r.note)}</li>`).join("")}</ul></div>`:""}`));

  if(k.words.length)B.push(step("认字词",`<div class="list-rows">${k.words.map(w=>{const st=m.words?.[w.word]||"";return`<div class="wd">
      <div class="zi${[...(w.word||"")].length>2?" long":""}"><span class="py">${esc(w.pinyin)}</span><span class="tzs">${[...(w.word||"")].map(ch=>`<b class="tz">${esc(ch)}</b>`).join("")}</span></div>
      <div class="txt">${w.meaning?`<p>${esc(w.meaning)}${w.isIdiom?`<span class="tag">成语</span>`:""}</p>`:""}${w.play?`<p><span class="k">玩一玩</span>${esc(w.play)}</p>`:""}${w.link?`<p><span class="k">联系问问</span>${esc(w.link)}</p>`:""}</div>
      <div class="acts"><button class="mk say" data-say="${esc(w.word)}" aria-label="读 ${esc(w.word)}">${SPK}</button><button class="mk ok" data-wm="${esc(w.word)}" data-v="ok" aria-pressed="${st==="ok"}">会了</button><button class="mk no" data-wm="${esc(w.word)}" data-v="stuck" aria-pressed="${st==="stuck"}">卡壳</button></div></div>`}).join("")}</div>`));

  if(k.retell.items.length)B.push(step(k.retell.type==="神兽档案"?"说说神兽档案":"讲讲这个故事",`<p class="muted">你说前半句，问问接后半句。</p><div class="list-rows">${k.retell.items.map(s=>`<div class="rt"><span class="lb">${esc(s.label)}</span><div><p class="pr">${esc(s.prompt)}</p>${ans("看答案",s.answer)}</div></div>`).join("")}</div>`));

  if(k.questions.length)B.push(step("两道题",`<div class="list-rows">${k.questions.map((q,i)=>{const st=m.q?.["q"+i]||"";return`<div class="qq"><span class="k">${esc(q.type||"")}</span><p class="qt">${esc(q.q)}</p><div>${ans("提示",q.hint)}${ans("参考答案",q.answer)}</div>
      <div class="row" style="gap:6px"><button class="mk ok" data-qm="q${i}" data-v="yes" aria-pressed="${st==="yes"}">自己答出</button><button class="mk mid" data-qm="q${i}" data-v="hint" aria-pressed="${st==="hint"}">提示后答出</button><button class="mk no" data-qm="q${i}" data-v="no" aria-pressed="${st==="no"}">还不会</button></div></div>`}).join("")}</div>`));

  if(k.chat)B.push(step("读完聊一句",`<p class="say-line">“${esc(k.chat)}”</p>`));
  const ex=k.examinerQuestions.filter(x=>x.q);
  if(ex.length)B.push(step("小考官时间",`<p class="muted">让问问来考你，可以故意答错让他纠正。</p><div class="list-rows">${ex.map(x=>`<div><p class="pr">${esc(x.q)}</p>${ans("看答案",x.answer)}</div>`).join("")}</div>`));

  B.push(step("读完了",`<label class="field"><span>今天卡壳的字（可不填）</span><input type="text" id="stuckChars" value="${esc(m.stuckChars||"")}" placeholder="比如：衔 填 淹"></label>
    <button class="donebtn ${m.done?"on":""}" data-act="done">${m.done?"✓ 今天读完了（点一下撤销）":"今天读完啦"}</button>`));

  const coll=[];
  if(k.beasts.length)coll.push(`<div class="cols">${k.beasts.map((b,i)=>beastHTML(b,i===0?(m.drawing||""):undefined)).join("")}</div>`);
  if(k.people.length)coll.push(`<div class="cols">${k.people.map(personHTML).join("")}</div>`);
  if(k.task?.name)coll.push(`<p><b>小任务：${esc(k.task.name)}</b>　${esc(k.task.desc)}</p>${cap.assets?`<div class="row"><label class="btn light" style="position:relative">${m.drawing?"换一张作品":"拍下问问的作品"}<input type="file" id="drawFile" accept="image/*" style="position:absolute;inset:0;opacity:0;width:100%"></label></div>`:""}`);
  if(coll.length)B.push(`<section class="block"><h2>收进积累本</h2>${coll.join("")}</section>`);

  B.push(`<div class="row" style="justify-content:space-between;padding:0 4px">
    <details class="redo" style="flex:1 1 300px"><summary class="link" style="display:inline">不满意？让 Claude 重新写</summary><div class="field" style="margin-top:8px"><textarea id="redoText" placeholder="比如：题目再简单一点；多联系一下恐龙"></textarea><div class="row"><button class="btn light" data-act="redo" ${cap.sample&&arr(c.photos).length?"":"disabled"}>重新生成</button>${arr(c.photos).length?"":`<span class="muted">这篇没有存照片，没法重新生成</span>`}</div></div></details>
    <button class="link red" data-act="del">删掉这一篇</button></div>`);
  $("#main").innerHTML=title+B.join("");
}

function renderBank(){
  const cs=sortedCards().filter(c=>c.card&&!c.example);
  const all=sortedCards().filter(c=>c.card);
  const src=cs.length?cs:all;
  const done=src.filter(c=>c.marks?.done);
  const days=new Set(done.map(c=>c.date));let streak=0,d=days.has(today())?today():addDays(today(),-1);while(days.has(d)){streak++;d=addDays(d,-1)}
  const stuck=[],learned=new Map(),beasts=[],people=new Map();
  for(const c of src){
    for(const w of c.card.words){if(!w?.word)continue;const st=c.marks?.words?.[w.word];
      if(st==="stuck")stuck.push({kind:"w",id:c.id,word:w.word,py:w.pinyin,from:c.card.title});
      if(!learned.has(w.word))learned.set(w.word,{...w,stuck:st==="stuck"})}
    for(const ch of [...new Set((c.marks?.stuckChars||"").replace(/[\s，,、。]/g,""))])stuck.push({kind:"c",id:c.id,word:ch,from:c.card.title});
    c.card.beasts.forEach((b,i)=>beasts.push({...b,drawing:i===0?(c.marks?.drawing||""):""}));
    for(const p of c.card.people)if(p?.name&&!people.has(p.name))people.set(p.name,p);
  }
  const words=[...learned.values()];
  const sec=(h,sub,body)=>`<div class="block"><h2>${h}</h2>${sub?`<p class="muted">${sub}</p>`:""}${body}</div>`;
  $("#v-bank").innerHTML=`
  ${!cs.length&&all.length?`<div class="note">现在显示的是示例卡的内容。问问读完第一篇后，这里就换成他自己的积累。</div>`:""}
  <div class="nums"><div><b>${done.length}</b><span>篇读完</span></div><div><b>${streak}</b><span>天连续</span></div><div><b>${words.length}</b><span>个字词</span></div><div><b>${beasts.length}</b><span>只神兽</span></div><div><b>${people.size}</b><span>位人物</span></div></div>
  ${sec("待巩固","问问认得了，点一下就移走。",stuck.length?`<div class="chips">${stuck.map(s=>`<button class="wc no" data-fix="${esc(s.kind)}|${esc(s.id)}|${esc(s.word)}"><span class="py">${esc(s.py||"")}</span><b>${esc(s.word)}</b><small>${esc(s.from||"")}</small></button>`).join("")}</div>`:`<p class="empty">还没有卡壳的字。</p>`)}
  ${sec("认过的字词","点一下听读音。",words.length?`<div class="chips">${words.map(w=>`<button class="wc ${w.stuck?"no":""}" data-say="${esc(w.word)}"><span class="py">${esc(w.pinyin)}</span><b>${esc(w.word)}</b></button>`).join("")}</div>`:`<p class="empty">生成第一张伴读卡后，字词会收在这里。</p>`)}
  ${sec("神兽图鉴","",beasts.length?`<div class="cols">${beasts.map(b=>beastHTML(b,b.drawing)).join("")}</div>`:`<p class="empty">读到神兽的篇目，神兽会收在这里。</p>`)}
  ${sec("三国人物卡","",people.size?`<div class="cols">${[...people.values()].map(personHTML).join("")}</div>`:`<p class="empty">开始读《三国演义》后，人物会收在这里。</p>`)}`;
}

    <label class="field"><span>喜欢的东西</span><textarea id="p-likes" rows="5">${esc(p.likes||"")}</textarea></label>
    <label class="field"><span>课内正在学的字（可不填）</span><textarea id="p-class" placeholder="比如：一 二 三 上 下 口 耳 目">${esc(p.inClass||"")}</textarea></label>
    <label class="field"><span>常读的书（用逗号隔开）</span><input type="text" id="p-books" value="${esc((p.books||["山海经","三国演义"]).join("，"))}"></label>
    <div class="row"><button class="btn" id="p-save">保存</button></div></div>
        <div class="block"><h2>怎么用</h2><ul class="plain">
      <li>提前点“准备新的一篇”，拍下要读的书页，Claude 会写好伴读卡。</li>
      <li>卡片按步骤从上往下用就行。答案都折起来了，可以把 iPad 给问问一起看。</li>
      <li>读完点字词的“会了”或“卡壳”，最后点“今天读完啦”。卡壳的字会进积累本，以后再出现时会提醒你。</li>
      <li>生成一篇伴读卡大约花几毛钱，从你的 Claude 账户余额里扣。</li>
    </ul></div>`;
}
$("#v-set").addEventListener("click",async e=>{
  if(e.target.id==="k-gh-save"){const v=$("#k-gh").value.trim();if(!v)return;ls.set("wwbd:ghkey",v);ls.set("wwbd:gist",null);refreshCap();renderSet();toast("同步钥匙存好了");DB.sync();return}
  if(e.target.id==="k-ai-save"){const v=$("#k-ai").value.trim();if(!v)return;if(!/^sk-ant-/.test(v)){toast("Claude 钥匙应该是 sk-ant- 开头的");return}ls.set("wwbd:apikey",v);refreshCap();renderSet();toast("Claude 钥匙存好了");return}
  if(e.target.id!=="p-save")return;
  const p={name:$("#p-name").value.trim()||"问问",grade:$("#p-grade").value,likes:$("#p-likes").value.trim(),inClass:$("#p-class").value.trim(),books:$("#p-books").value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean)};
  S.profile=p;
  DB.put("settings","profile",p);
  toast("保存好了");
});

/* ---------------- 切换 ---------------- */
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
  S.tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  $("#v-cards").hidden=S.tab!=="cards";$("#v-bank").hidden=S.tab!=="bank";$("#v-set").hidden=S.tab!=="set";
  if(S.tab==="bank")renderBank();if(S.tab==="set")renderSet();
}));
function renderMain(){if(S.view==="card"&&S.sel&&S.cards[S.sel])renderCard(S.sel);else{S.view="new";renderNew()}}
function onCardsChanged(changedId){
  renderList();
  if(S.tab==="bank")renderBank();
  if(S.view==="card"&&(!changedId||changedId===S.sel)){
    if(document.activeElement?.id==="stuckChars"||document.activeElement?.id==="redoText")return;
    renderMain();
  }
}
function firstView(){
  if(S.loaded)return;S.loaded=true;
  const cs=sortedCards();const t=cs.find(c=>c.date===today()&&!c.example);
  if(t){S.sel=t.id;S.view="card"}else if(cs.length&&cs.every(c=>c.example)){S.sel=cs[0].id;S.view="card"}else{S.view="new"}
  renderList();renderMain();
}

/* ---------------- 启动 ---------------- */
/* iPad 主屏幕会缓存旧页面：每次打开都问一下网上有没有新版本，有就换上 */
const BUILD="be2038ee89";
if(location.protocol.startsWith("http")){const chk=()=>fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{const m=t.match(/const BUILD="(\w+)"/);if(m&&m[1]!==BUILD&&!Object.keys(S.live).length)location.replace(location.pathname+"?v="+m[1])}).catch(()=>{});
  chk();document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()})}
new MutationObserver(hydrate).observe(document.body,{childList:true,subtree:true});
(function init(){
  refreshCap();
  const pull=()=>{const m={...DB.data.cards};for(const id in S.live)if(!m[id]&&S.cards[id])m[id]=S.cards[id];S.cards=m;S.profile=DB.data.settings.profile||null};
  pull();firstView();
  DB.subs.push(()=>{pull();if(S.loaded)onCardsChanged(null);if(S.tab==="set"&&document.activeElement?.closest?.("#v-set")==null)renderSet()});
  DB.start();
})();
</script>
</body></html>
